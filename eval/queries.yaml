# Контрольные запросы для проверки качества (часть 3 задания): 40 запросов, 14 из них без ответа в базе.
#
# ПРОИСХОЖДЕНИЕ. Запросы написаны ассистентом (Claude) по строкам базы и переписаны «как написал бы другой человек»:
# другие слова и сокращения, другая запись чисел и единиц, синонимы, слитное/раздельное написание. Они НЕ пропускались
# через нормализатор проекта. Верные ответы заданы ВРУЧНУЮ списком строк базы после чтения каталога (не вычислены извлекателем).
# Автор прототипа и специалист заказчика обязаны просмотреть файл: поле `reviewed_by` пусто, пока этого не сделано.
#
# ПРОТОКОЛ ЗАМЕРА. Конфигурация поиска была подобрана ДО написания этих запросов (на пробных наборах из каталога).
# Деление: `dev` (10) — на них разрешено разбирать ошибки и исправлять общие дефекты; `test` (10) — смотрятся один раз,
# по их ошибкам система НЕ настраивается (исправления откладываются в план). В отчёте приводится и результат до исправлений,
# и после, отдельно для dev и test.
#
# Значения key для model_codes записаны как в тексте; скрипт приводит их к форме сравнения.
# HOLDOUT (10 запросов H01–H10, добавлены позже). Строки выбраны СЛУЧАЙНО из всего датасета (random.Random(20260604).shuffle по
# порядку строк; пропущены строки без содержания для переписывания: меньше 3 слов, длиннее 260 символов, заголовок комплекта
# короче 6 слов, а также строки, уже ставшие ответом другого запроса; при выборе пропущена одна строка: row-002230 «Шайба 6/125»).
# Затем каждая строка переписана вручную (другой порядок слов, другие слова и сокращения, другая запись чисел), БЕЗ запуска системы
# на этих запросах. Ответы заданы по чтению каталога, с учётом строк-близнецов. На holdout система НЕ настраивается: ошибки
# разбираются, но не исправляются; результат приводится отдельно.
# ЗАПРОСЫ БЕЗ ОТВЕТА (N1–N4 и X01–X10, всего 14). Здесь проверяется ОТСУТСТВИЕ СОВПАДЕНИЙ С ШАБЛОНАМИ в исходном xlsx независимо от
# системы; это не доказательство, что в базе нет ни одного семантического аналога, поэтому решение об отсутствии остаётся за экспертом
# (`expert_decision`: пусто, пока не проставлено).
#   absence_checks — список групп; группа = несколько регулярных выражений `patterns`, которые должны совпасть в ОДНОЙ строке
#       (логическое И). Группа подтверждает отсутствие, если ни одна строка xlsx (сырое название, без учёта регистра) не совпала со всеми
#       образцами. Чтобы шаблон нельзя было «сломать» незаметно (лишний якорь, неверная буква единицы: тогда он ничего бы не находил),
#       у каждой группы есть `synthetic_witness`: придуманное название, на котором совпадают ВСЕ образцы (шаблон способен сработать),
#       и `near_miss`: близкое название, на котором группа НЕ срабатывает (шаблон не слишком широк).
#   variants_checked — более широкие записи (другие знаки умножения, единицы, синонимы), проверенные по xlsx; `rows_matched` — сколько
#       строк найдено, `note` — почему найденное не ответ. Тест сверяет число с текущим xlsx.
#   X01–X05: нужной вещи в базе нет совсем; X06–X10: вещь того же типа есть, но нужного размера/параметра/разновидности нет.
# ПОЛЯ.  answer_rows — строки, которые допустимо выдать (пусто = ответа в базе нет);
#        key — характеристика, по которой считается ошибка «на первом месте позиция с другой важной характеристикой»
#        (attribute и значение в канонической записи; сверяется с характеристиками первой выданной строки).
#
# СТАТУС НАБОРА (читается генератором отчёта eval/evaluate.py; заголовки отчёта берутся отсюда, не из кода).
# Все запросы ниже использовались при принятии решений об изменениях (разбор ошибок, быстрые исправления, допущения, синонимы), поэтому набор
# служит ВНУТРЕННЕЙ РЕГРЕССИЕЙ, а не независимой оценкой. Независимая оценка требует нового набора, подготовленного другим человеком
# и замороженного до первого прогона (eval/PROTOCOL.md).
usage: regression
independence: not_independent
set_name: internal-regression-v1
splits:
  dev: "исходный dev: ошибки разбирались и исправлялись; использован при исправлениях"
  test: "исходный test: ошибки были видны до правок; по ним исправлялись общие механизмы; использован при исправлениях"
  holdout: "исходный holdout: 10 случайных строк (H01–H10) и 10 запросов без ответа (X01–X10); ошибки H01–H10 разобраны и частично исправлены; использован при исправлениях"
