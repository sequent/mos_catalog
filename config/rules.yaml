# Правила допустимых замен и политика выдачи.
# ЧЕРНОВИК: всё, что здесь записано, — ДОПУЩЕНИЕ автора прототипа (status: assumption).
# Настоящие правила задаёт специалист заказчика. Код правила не содержит — он только читает этот файл.
#
# Файл разделён на ТРИ независимые части (так же, как шаги B4, B5, B6 на схеме):
#   B4  техническая совместимость  → rules + policy.type/composite/dims_order  (только факты о характеристиках)
#   B5  ранжирование               → policy.ranking                             (только порядок, совместимость не меняет)
#   B6  итоговый вердикт           → policy.verdict / policy.not_found          (что показать и когда сказать «не найдено»)
#
# Как специалист меняет правило: правит строку ниже (режим, допуск, шкалу), потом запускает проверку примеров
# (`.venv/bin/python -I -m pytest tests/test_rules.py`). Версия правил (`version`) пишется в каждый ответ поиска.
# Подробная инструкция для специалиста — в README.md.
#
# Режимы сравнения (`mode`):
#   exact   значения должны совпасть, иначе «конфликт»
#   ladder  значения — ступени шкалы; разница не больше `max_steps` ступеней — «допустимая замена»
#   min_ge  значение кандидата не меньше запрошенного — «допустимая замена»
#   flag    отличие показывается, но не отклоняет: итог «проверить со специалистом»
#   ignore  не сравнивать

version: 0.2-draft
status: assumption          # assumption | approved_by_specialist

# ============================================================== B4: правила по характеристикам
rules:
  - id: cable_cores_section
    assumption: A01
    title: "Число жил и сечение кабеля должны совпадать строго"
    applies_to: [кабель контрольный, кабель силовой, кабель, провод]
    attribute: cores_section
    mode: exact
    examples:
      - {query: "КВВГнг-LS 7*1.5", candidate: "КВВГЭнг(A)-LS 7х1,5", expect: match}
      - {query: "КВВГнг-LS 7*1.5", candidate: "КВВГЭнг(А)-LS 7x2,5", expect: conflict}

  - id: cable_screen
    assumption: A03
    title: "Экран кабеля (буква Э в маркировке): отличие показывать, но не отклонять"
    applies_to: [кабель контрольный, кабель силовой, кабель, провод]
    attribute: cable_screen
    mode: flag
    examples:
      - {query: "КВВГнг-LS 7*1.5", candidate: "КВВГЭнг(A)-LS 7х1,5", expect: flag}

  - id: cable_fire_class
    assumption: A02
    title: "Класс пожарной безопасности кабеля (LS / FRLS / HF) должен совпадать"
    applies_to: [кабель контрольный, кабель силовой, кабель, провод]
    attribute: fire_class
    mode: exact
    examples:
      - {query: "ВВГнг(A)-LS 3х6", candidate: "ВВГнг(A)-FRLS 3х6", expect: conflict}

  - id: camera_resolution
    assumption: A04
    title: "Разрешение камеры: допустимо отличие на одну ступень шкалы"
    applies_to: [видеокамера]
    attribute: resolution_mp
    mode: ladder
    ladder: [1, 2, 3, 4, 5, 8, 12]       # ДОПУЩЕНИЕ: шкала разрешений, Мп
    max_steps: 1
    examples:
      - {query: "камера 3 Мп", candidate: "видеокамера 2Мп", expect: substitute}
      - {query: "камера 4 Мп", candidate: "видеокамера 2Мп", expect: conflict}

  - id: gate_size
    assumption: A05
    title: "Размеры ворот должны совпадать, порядок сторон не важен"
    applies_to: [ворота, ворота откатные]
    attribute: dims
    mode: exact
    dims: sorted
    examples:
      - {query: "ворота откатные 6000х2250", candidate: "Ворота откатные 2250х6000 мм", expect: match}

# Порядок сторон в размерах (A×B). Единицы приводятся к мм при извлечении; порядок решается здесь.
#   sorted  порядок не важен (6000×2250 = 2250×6000)
#   ordered порядок важен (ширина×высота)
# Для типов, которых здесь нет, размеры, совпавшие только после перестановки, получают статус
# «совпало с точностью до порядка» и итог «проверить» (не «та же позиция»).
dims_order:
  sorted: [ворота, ворота откатные]      # ДОПУЩЕНИЕ
  ordered: [лоток, воздуховод, решетка жалюзийная]   # ДОПУЩЕНИЕ: ширина×высота

# Характеристики, не названные в правилах: числовое отличие — конфликт (осторожное умолчание).
defaults:
  # Размеры, совпавшие только после перестановки сторон, для типа БЕЗ записи в dims_order:
  #   check    «совпало с точностью до порядка», итог «проверить» (осторожно; по умолчанию)
  #   sorted   порядок не важен (6000×2250 = 2250×6000): кандидат может стать «та же позиция»
  #   ordered  порядок важен: перестановка — конфликт
  # На пробном наборе этапа 5 из-за этого настройка «check» оставляет без подтверждения около 14 % коротких запросов с размерами.
  dims_order_unlisted: check
  unlisted_numeric_attribute: exact
  # Режим для характеристик без собственного правила (остальные — по unlisted_numeric_attribute):
  #   info       совпадение — подтверждение, отличие ничего не блокирует (так для кодов моделей:
  #              другой код = другая модель, а аналог по определению может быть другой моделью)
  #   flag       отличие показывается, итог «проверить»
  #   ambiguous  значение названо без смысла («25 мм»): совпадение с любым значением кандидата — «проверить»
  #   ignore     не сравнивать
  per_attribute:
    model_codes: info
    standard: flag
    bare_mm: ambiguous
    conductor_form: ignore
    color: flag                         # ДОПУЩЕНИЕ: другой цвет показывается, итог «проверить»; «любой цвет» в запросе отключает сравнение

# ============================================================== политика
policy:

  # --- B3 → B4: тип изделия — СИГНАЛ, а не фильтр. Классификатор может ошибаться или молчать
  #     (у ~14 % строк типа нет, многие типы грубые), поэтому тип никого не удаляет «молча».
  type:
    relation:                           # как сравнивается тип запроса (q) и тип кандидата (c)
      same: match                       # одинаковый тип
      same_family_q_generic: match      # q общий («кабель»), c уточнён («кабель контрольный»)
      same_family_both_specific: check  # оба конкретные, но разные («кабель контрольный» / «кабель силовой»)
      same_family_c_generic: check      # q конкретный, c общий («кабель контрольный» / «кабель»): подтвердить нельзя
      unknown_either_side: unknown      # тип неизвестен у запроса или кандидата: нейтрально, показывается «нет данных»
      different_both_specific: conflict # разные семейства и оба типа конкретные: «не подходит»
      different_one_generic: check      # разные семейства, но один тип общий: «проверить», пометка «тип иной»

  # --- B4: составные позиции («… в составе:») — обычные позиции, не исключаются
  composite:
    max_compatibility: unverified       # состав комплекта в базе не проверяется → «та же позиция» невозможна
    label: "комплект"

  # --- B4: доказательства. Класс «совместим» возможен только при подтверждённых фактах.
  # «Подтверждение» = совпавшая или заменяемая по правилу характеристика, совпавший код модели или дословно
  # совпавшее название. Одного совпадения типа недостаточно: все камеры не «та же позиция» для запроса «камера».
  evidence:
    require_confirmed_attribute: true   # иначе максимум «unverified»
    # Совпадение этих характеристик подтверждением не считается (они слишком общие: «уличный» подходит к чему угодно).
    # В выдаче они показываются и участвуют в ранжировании.
    weak_attributes: [placement, color, quantity_pcs, class_roman, distance_km]      # количество штук, римский класс и расстояние сами по себе вещь не подтверждают (отличие при этом даёт конфликт)
    # ДОПУЩЕНИЕ: для этих типов совпадения самого типа достаточно для «той же позиции» (в запросе нет характеристик, а
    # производитель и модель не важны: «инфракрасный термометр любого производителя»). Конфликт по любой названной
    # характеристике по-прежнему отклоняет. Список пополняет специалист.
    confirm_by_type: [термометр инфракрасный]

  # --- B4: ограничения запроса, которые система не смогла разобрать. ДОПУЩЕНИЕ автора (решение автора).
  #     Число с единицей («50 Гц») или число после названия величины («мощность 100»), которое не стало характеристикой,
  #     не может «тихо исчезнуть»: ответ не выше «проверить», пока то же значение не названо и у кандидата.
  #     Остальные числа (одиночное число, номер ссылки) только показываются. Пустой список отключает защиту.
  unparsed_constraints:
    blocking_reasons: [number_with_unit, measurement_label]

  # --- B4: слова запроса, которые ни одна характеристика не объясняет («порошковый», «ПВХ», «вариофокальная»).
  #     Если кандидат содержит слишком малую долю таких слов, подтверждённым он быть не может.
  word_coverage:
    type_word_required: true            # слово-тип, которым названа вещь в запросе («задвижка»), должно быть в названии кандидата, иначе не подтверждён
    min_for_confirmed: 0.5              # ДОПУЩЕНИЕ; было 0,7: на естественных запросах бракует описательные слова («длина», «теплоизоляция»). Материал проверяется отдельной характеристикой

  # --- B5: ранжирование. Не меняет ни совместимость, ни вердикт, только порядок внутри класса совместимости.
  ranking:
    order: [compatible, compatible_with_substitution, unverified]    # класс совместимости важнее любого балла
    score:
      weights: {attribute_coverage: 0.6, text_relevance: 0.4}       # ДОПУЩЕНИЕ, подбирается на dev-запросах
      # Текстовая близость собирается из оценки слов (надёжна на числах) и близости смысла (надёжна на синонимах);
      # место в RRF не используется: на числах оно хуже оценки слов (см. reports/retrieval/conclusions.md).
      text_mix: {bm25: 0.7, dense: 0.3}
      pair_boost: 0.05                  # локальная добавка для пары, подтверждённой специалистом (см. feedback)

  # --- B6: итоговый вердикт и «не найдено» (только отображение класса совместимости, новых фактов не создаёт)
  verdict:
    map:
      compatible: same                  # все названные характеристики совпали
      compatible_with_substitution: substitute
      unverified: check                 # конфликтов нет, но часть характеристик неизвестна
      incompatible: reject              # конфликт в обязательной характеристике → в выдачу не попадает
  not_found:
    confirmed_verdicts: [same, substitute]
    # Если подтверждённо подходящих нет, статус ответа — «не найдено». Это не зависит от числа слабых кандидатов.
    show_unconfirmed: true              # ниже, отдельным списком «не подтверждены, требуют проверки специалистом»
    unconfirmed_limit: 3
    show_nearest_rejected: true         # ближайшая позиция с причиной отказа («отличается сечением»)
    # Слабые кандидаты и «ближайшее» показываются только при слабом доказательстве (хотя бы одна совпавшая
    # характеристика или совпавший конкретный тип), иначе при «не найдено» выдача превращается в случайные строки.
    require_weak_evidence: true
    # В эти списки не попадают кандидаты с явно другим типом (разные семейства), а также кандидаты, у которых тип не
    # совпал и слов запроса меньше этой доли: так «замок 12 В» не становится «возможным ИБП».
    min_word_coverage_for_listing: 0.4
    # Что считается слабым доказательством (достаточно для показа в «не подтверждены», но не для «подтверждён»):
    #   частичное совпадение характеристики (размеры совпали после перестановки сторон, значение есть только в «прим.»,
    #   значение без смысла) или почти дословное совпадение слов запроса.
    partial_confirmations_count: true
    text_evidence: {min_coverage: 0.9, min_words: 3}

  # --- Интерфейс (решение автора прототипа): когда подтверждённых нет, варианты «требует проверки» показываются
  #     В ОСНОВНОЙ ТАБЛИЦЕ с пометкой и строкой статуса, а не прячутся в отдельный список. Показываются только кандидаты
  #     со слабым доказательством (policy.not_found), поэтому это не «пять случайных строк».
  ui:
    review_in_main_table: true
    review_rows_when_found: 2           # если подтверждённые есть, но их меньше 5: сколько вариантов «проверить» добавить ниже
    review_table_limit: 5               # сколько вариантов «проверить» показывать, когда подтверждённых нет
    status_lines:
      found: "Найдено подходящих позиций: {n}"
      found_with_review: "Найдено подходящих позиций: {n}. Ниже варианты, которые требуют проверки"
      review: "Подтверждённых подходящих позиций не найдено. Ниже варианты для проверки"
      not_found: "Не найдено"
