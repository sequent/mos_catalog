# Словари поиска. Редактирует специалист (код не меняется).
# Тексты в шаблонах — в нижнем регистре, буква «ё» заменена на «е».
#
# replace: аббревиатура заменяется расшифровкой (и в базе, и в запросе).
# expand:  к тексту ДОБАВЛЯЕТСЯ синоним (оригинальное слово остаётся).
# types:   тип изделия определяется по началу названия; порядок важен (частное выше общего).
#          «семейство» типа = первое слово названия типа (кабель контрольный → кабель);
#          семейство нужно шагу B3 («родственный тип»).
#          Перед шаблоном автоматически допускаются ведущие прилагательные (уличный, настенный, цифровой…).

synonyms:
  replace:
    - {pattern: '\bибп\b', to: 'источник бесперебойного питания'}
    - {pattern: '\bгофра\b', to: 'гофрированная труба'}
    - {pattern: '\bдля улицы\b', to: 'уличный'}
    - {pattern: '\bпатчкорд', to: 'патч-корд'}
    - {pattern: '\bэлектроконвектор\w*', to: 'конвектор электрический'}
    # Синонимы типов и слов (ДОПУЩЕНИЕ автора; применяются и к базе, и к запросу, поэтому тип определяется одинаково):
    - {pattern: '\bдатчик\w*(?=\s+(?:пожарн|охранн|дымов))', to: 'извещатель'}      # только пожарный/охранный: «датчик температуры» не извещатель
    - {pattern: '\bогнезадерживающ\w*', to: 'противопожарный'}                       # огнезадерживающий клапан = противопожарный клапан
    - {pattern: '\bдооснащени\w*', to: 'доукомплектация'}
    - {pattern: '\bдействующ\w*', to: 'существующих'}
    - {pattern: '\bхуавей\b', to: 'huawei'}
    - {pattern: '\bпогр\.', to: 'погрузка'}                                         # услуги в сокращённой записи («Погр.», «Разгр.», «Перевоз.»)
    - {pattern: '\bразгр\.', to: 'разгрузка'}
    - {pattern: '\bперевоз\.', to: 'перевозка'}
    - {pattern: '\bкомпл(?![а-я])\.?', to: 'комплект'}                               # «компл. кронштейнов» = комплект кронштейнов
    - {pattern: '\bгидропресс\w*', to: 'пресс гидравлический'}                      # одно и то же изделие, исходный фрагмент остаётся в названии
    - {pattern: '\bопт(?![а-я])\.?(?=\s+(?:кросс|кабел|разъем|волокн|муфт|патч))', to: 'оптический'}   # «опт.» только рядом с оптическими изделиями
    - {pattern: '\bвыкл(?![а-я])\.?', to: 'выключатель'}                           # «выкл.» в названии выключателя (и в базе, и в запросе)
  expand:
    - {pattern: '\bкамера\b', add: 'видеокамера'}
    - {pattern: 'вариофокальн\w*', add: 'моторизированный объектив'}
    - {pattern: 'оптическ\w*', add: 'оптоволоконный'}
    - {pattern: 'оптоволоконн\w*', add: 'оптический'}
    - {pattern: 'моторизированн\w*\s+объектив', add: 'вариофокальный'}

# Ведущие слова, которые не меняют тип («уличный источник…», «настенный блок…»).
leading_adjectives: [уличн, наружн, внутренн, настенн, напольн, универсальн, цифров, типов, переносн,
                     электрическ, оптическ, взрывозащищенн, стальн, оцинкованн, малогабаритн, автоматическ]

# Однословные типы, которые достаточно конкретны (название вещи, а не широкое семейство).
# Многословные типы («кабель контрольный») считаются конкретными автоматически; остальные однословные
# («шкаф», «блок», «комплект», «труба», «кабель») — общие. Общий тип — слабый сигнал: он НИКОГДА не отсекает
# кандидата сам по себе (см. config/rules.yaml → policy.type).
specific_single_word_types:
  - видеокамера
  - ворота
  - огнетушитель
  - воздуховод
  - светильник
  - извещатель
  - вентилятор
  - колодец
  - принтер
  - ноутбук
  - сервер
  - коммутатор
  - кондиционер
  - прожектор
  - розетка
  - вилка
  - мегаомметр
  - дефлектор
  - диффузор
  - шумоглушитель
  - гидрант
  - задвижка
  - изолятор
  - счетчик
  - выключатель                 # раньше типа не было: розетка на 250 В/16 А подтверждала «выключатель»
  - толщиномер
  - манометр
  - хроматограф
  - пробоотборник
  - кросс

# Материалы: слова-значения характеристики «материал». Если в запросе назван материал, а в названии кандидата другой,
# это конфликт (труба ПВХ ≠ труба ПНД); если у кандидата материал не назван — «нет данных». Если назван любой из материалов
# запроса, это совпадение. Шаблоны — регулярные выражения по словам, регистр не важен.
materials:
  - {name: ПВХ, patterns: ['пвх', 'поливинилхлорид\w*']}
  - {name: полиэтилен, patterns: ['пнд', 'пвд', 'полиэтилен\w*', 'пэ', 'пэ\s?\d+']}      # ПНД и ПЭ — один материал
  - {name: полипропилен, patterns: ['полипропилен\w*', 'пп']}
  - {name: полиамид, patterns: ['полиамид\w*']}
  - {name: сталь, patterns: ['стал[ьиеюя]', 'стальн\w*']}
  - {name: металл, patterns: ['металлическ\w*']}      # общее слово, см. generic_materials
  - {name: нержавеющая сталь, patterns: ['нержавеющ\w*']}
  - {name: медь, patterns: ['медн\w*', 'мед[ьи]']}
  - {name: алюминий, patterns: ['алюмин\w*']}
  - {name: чугун, patterns: ['чугун\w*']}
  - {name: бетон, patterns: ['бетон\w*', 'железобетон\w*']}
  - {name: стеклопластик, patterns: ['стеклопластик\w*']}
  - {name: каучук, patterns: ['каучук\w*']}
  - {name: дерево, patterns: ['древесин\w*', 'деревянн\w*']}

# Общие слова о материале. ДОПУЩЕНИЕ автора: «металлическая» = стальная (same_as). С другими металлами из any_of общее слово
# не конфликтует: «металлическая труба» может быть и алюминиевой, итог «нет данных». С неметаллами (ПВХ, полиэтилен) — конфликт.
generic_materials:
  металл: {same_as: [сталь], any_of: [сталь, нержавеющая сталь, медь, алюминий, чугун]}

# Цвета: слова-значения характеристики «цвет». Совпал любой из названных цветов — совпадение; другой цвет — отличие
# (режим задаётся в rules.yaml: defaults.per_attribute.color). Если в запросе написано «любой цвет», цвет не сравнивается.
colors:
  - {name: белый, patterns: ['бел(?:ый|ая|ое|ые|ого|ой|ым|ом)']}
  - {name: чёрный, patterns: ['[чч][её]рн(?:ый|ая|ое|ые|ого|ой|ым|ом)']}
  - {name: красный, patterns: ['красн(?:ый|ая|ое|ые|ого|ой|ым|ом)']}
  - {name: синий, patterns: ['син(?:ий|яя|ее|ие|его|ей|им|ем)']}
  - {name: зелёный, patterns: ['зел[её]н(?:ый|ая|ое|ые|ого|ой|ым|ом)']}
  - {name: жёлтый, patterns: ['[жж][её]лт(?:ый|ая|ое|ые|ого|ой|ым|ом)']}
  - {name: серый, patterns: ['сер(?:ый|ая|ое|ые|ого|ой|ым|ом)']}
  - {name: коричневый, patterns: ['коричнев(?:ый|ая|ое|ые|ого|ой|ым|ом)']}
  - {name: оранжевый, patterns: ['оранжев(?:ый|ая|ое|ые|ого|ой|ым|ом)']}

# Фразы запроса «подойдёт любой…»: характеристика не важна. Фраза вырезается из запроса (слова «любого», «производителя»
# не требуются в названии кандидата), а в ответе показывается как принятое допущение. ДОПУЩЕНИЕ автора.
any_phrases:
  - {attribute: manufacturer, label: "производитель", patterns: ['любого\s+производителя', 'любой\s+производитель', 'любого\s+изготовителя', 'любой\s+бренд', 'любой\s+фирмы']}
  - {attribute: color, label: "цвет", patterns: ['любого\s+цвета', 'любой\s+цвет']}

# «25 мм» без слова «диаметр»: что это значит для семейства. Для остальных остаётся «просто мм»
# (сравнивается только с таким же числом без смысла, вердикт «проверить»). ДОПУЩЕНИЕ автора.
bare_mm_means:
  труба: diameter_mm
  трубка: diameter_mm
  рукав: diameter_mm
  металлорукав: diameter_mm

types:
