# Категориальные характеристики. Значение называется по-русски или по общему обозначению (A3, LC); `contexts` — семейства типов, у которых
# слово имеет этот смысл («цветной» у принтера — цвет печати, у кабеля — не он). Известное другое значение = конфликт, нет значения = нет данных.
# ДОПУЩЕНИЕ автора; список пополняет специалист.
features:
  - attribute: print_technology
    label: технология печати
    contexts: [принтер, мфу]
    values: {лазерная: ['лазерн\w*'], струйная: ['струйн\w*'], термотрансферная: ['термотрансфер\w*', 'термосублимац\w*']}
  - attribute: print_color_mode
    label: цвет печати
    contexts: [принтер, мфу]
    values: {цветная: ['(?<![а-я])цветн(?:ой|ая|ое|ые|ую|ого)(?![а-я])'], монохромная: ['монохром\w*', 'черно-?бел\w*']}      # «полноцветный картридж» цветную печать не доказывает
  - attribute: paper_format
    label: формат бумаги
    contexts: [принтер, мфу, сканер]
    values: {A1: ['(?<![a-zа-я0-9])[aа]1(?![a-zа-я0-9])'], A2: ['(?<![a-zа-я0-9])[aа]2(?![a-zа-я0-9])'], A3: ['(?<![a-zа-я0-9])[aа]3(?![a-zа-я0-9])'],
             A4: ['(?<![a-zа-я0-9])[aа]4(?![a-zа-я0-9])'], A5: ['(?<![a-zа-я0-9])[aа]5(?![a-zа-я0-9])']}
  - attribute: connector_type
    label: тип разъёма
    contexts: [кросс]
    values: {LC: ['(?<![a-zа-я0-9])lc(?![a-zа-я0-9])'], SC: ['(?<![a-zа-я0-9])sc(?![a-zа-я0-9])'], FC: ['(?<![a-zа-я0-9])fc(?![a-zа-я0-9])'], ST: ['(?<![a-zа-я0-9])st(?![a-zа-я0-9])']}
  - attribute: mounting
    label: исполнение (монтаж)
    contexts: [кросс]
    values: {настенное: ['настенн\w*'], стоечное: ['стоечн\w*', 'в\s+стойку']}

# Из чего может состоять комплект (названо в запросе «с … » и в названии позиции). Запрос с компонентом подтверждается, когда позиция его называет;
# «без гильз» компонентом не считается. ДОПУЩЕНИЕ автора.
kit_components:
  пигтейл: ['пигтейл\w*', 'pigtail\w*']
  гильза: ['гильз\w*']
  метизы: ['метиз\w*']
  матрицы: ['матриц\w*']
